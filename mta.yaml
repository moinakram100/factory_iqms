_schema-version: 3.3.0
ID: factory_IQMS
description: A simple CAP project.
version: 1.0.0
modules:
- name: factory_IQMS-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: factory_IQMS-destination
  - name: factory_IQMS-db
  - name: factory_IQMS-auth
  - name: factory_IQMS-connectivity
  - name: factory_IQMS-destination-service
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: factory_IQMS-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: factory_IQMS-db
  parameters:
    buildpack: nodejs_buildpack
- name: factory_IQMS-destination-content
  type: com.sap.application.content
  requires:
  - name: factory_IQMS-destination-service
    parameters:
      content-target: true
  - name: factory_IQMS_html_repo_host
    parameters:
      service-key:
        name: factory_IQMS_html_repo_host-key
  - name: factory_IQMS-auth
    parameters:
      service-key:
        name: factory_IQMS-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: factoryiqmsCloudSrv_factory_IQMS_html_repo_host
          ServiceInstanceName: factory_IQMS-html5-app-host-service
          ServiceKeyName: factory_IQMS_html_repo_host-key
          sap.cloud.service: factoryiqmsCloudSrv
        - Authentication: OAuth2UserTokenExchange
          Name: factoryiqmsCloudSrv_factory_IQMS_auth
          ServiceInstanceName: factory_IQMS-auth
          ServiceKeyName: factory_IQMS-auth-key
          sap.cloud.service: factoryiqmsCloudSrv
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: factory_IQMS-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: factory_IQMS_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - comingenxqmsparkingfactory.zip
      name: comingenxqmsparkingfactory
      target-path: resources/
    - artifacts:
      - comingenxqmsschedulingfactory.zip
      name: comingenxqmsschedulingfactory
      target-path: resources/
    - artifacts:
      - comingenxqmstruckassignmentfactory.zip
      name: comingenxqmstruckassignmentfactory
      target-path: resources/
    - artifacts:
      - comingenxqmsconfigfactory.zip
      name: comingenxqmsconfigfactory
      target-path: resources/
    - artifacts:
      - comingenxqmspgigrbilling.zip
      name: comingenxqmspgigrbilling
      target-path: resources/
    - artifacts:
      - comingenxqmsanalyticsfactory.zip
      name: comingenxqmsanalyticsfactory
      target-path: resources/
    - artifacts:
      - comingenxqmsfangenerationfactory.zip
      name: comingenxqmsfangenerationfactory
      target-path: resources/
- name: comingenxqmsparkingfactory
  type: html5
  path: app/parkingfactory
  build-parameters:
    build-result: dist
    supported-platforms: []
- name: comingenxqmsschedulingfactory
  type: html5
  path: app/schedulingfactory
  build-parameters:
    build-result: dist
    supported-platforms: []
- name: comingenxqmstruckassignmentfactory
  type: html5
  path: app/truckassignmentfactory
  build-parameters:
    build-result: dist
    supported-platforms: []
- name: comingenxqmsconfigfactory
  type: html5
  path: app/configfactory
  build-parameters:
    build-result: dist
    supported-platforms: []
- name: comingenxqmspgigrbilling
  type: html5
  path: app/pgi_gr_billing
  build-parameters:
    build-result: dist
    supported-platforms: []
- name: comingenxqmsanalyticsfactory
  type: html5
  path: app/analyticsfactory
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
- name: comingenxqmsfangenerationfactory
  type: html5
  path: app/fangenerationfactory
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: factory_IQMS-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: factory_IQMS-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: factory_IQMS-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: factory_IQMS-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
- name: factory_IQMS-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: factory_IQMS-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: factory_IQMS-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: factory_IQMS-connectivity
  type: org.cloudfoundry.managed-service
  parameters:
    service: connectivity
    service-plan: lite
- name: factory_IQMS_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: factory_IQMS-html5-app-host-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
